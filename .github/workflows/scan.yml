name: 30-minute job scan

on:
  workflow_dispatch:
  schedule:
    # Avoid the top of the hour, when scheduled Actions experience more delays.
    - cron: "17,47 * * * *"
    # A monthly state-only commit prevents GitHub from disabling an inactive
    # public repository's scheduled workflow after 60 days. It sends no alert.
    - cron: "23 3 1 * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: scout-x5-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Scout X5
        run: python -m pip install .

      - name: Ensure alert label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create job-alert --color 1D76DB --description "New Scout X5 matches" || true

      - name: Scan job boards
        env:
          GH_TOKEN: ${{ github.token }}
          SCOUT_GITHUB_ISSUES: "1"
        run: scout-x5

      - name: Keep the public schedule active
        if: github.event.schedule == '23 3 1 * *'
        run: date -u > data/.heartbeat

      - name: Persist scan history
        run: |
          git config user.name "scout-x5[bot]"
          git config user.email "scout-x5[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: update job scan state"
          git push
