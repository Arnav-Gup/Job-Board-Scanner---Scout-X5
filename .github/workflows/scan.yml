name: Daily job scan

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. This is 9:17 AM Pacific during daylight-saving time.
    - cron: "17 16 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: scout-x5-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Scout X5
        run: python -m pip install .

      - name: Ensure alert label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create job-alert --color 1D76DB --description "New Scout X5 matches" || true

      - name: Scan job boards
        env:
          GH_TOKEN: ${{ github.token }}
          SCOUT_GITHUB_ISSUES: "1"
        run: scout-x5

      - name: Persist scan history
        run: |
          git config user.name "scout-x5[bot]"
          git config user.email "scout-x5[bot]@users.noreply.github.com"
          git add data/scout.db data/latest.md
          git diff --cached --quiet || git commit -m "chore: update job scan state"
          git push
