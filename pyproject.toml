[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scout-x5"
version = "0.1.0"
description = "A configurable, resume-aware job board scanner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
scout-x5 = "scout_x5.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scout_x5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
